name: Release

# Run from the Actions tab once the version PR (`pnpm version-packages`) has merged into main.
# Publishes every package version that isn't on GitHub Packages yet and pushes its git tag.
on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}

permissions:
  contents: write
  packages: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@halth'
      - run: pnpm install --frozen-lockfile
      - name: Check versions are bumped
        run: |
          if [ -n "$(find .changeset -name '*.md' ! -name README.md)" ]; then
            echo "::error::Unreleased changesets on main. Run pnpm version-packages in a PR to main first."
            exit 1
          fi
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: git push origin --tags
